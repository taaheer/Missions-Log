name: Build and Release Missions Log

on:
  push:
    branches:
      - test-installer

permissions:
    contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
            
          - os: windows-latest
            host: windows
            arch: win64_msvc2022_64
            artifact: Output/MissionsLog-Installer.exe
            artifact_name: MissionsLog-Installer.exe
            
          - os: macos-latest
            host: mac
            arch: ''
            artifact: build/MissionsLog.dmg
            artifact_name: MissionsLog-macOS.dmg

    steps:
    - name: Download the code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSVC Developer Command Prompt (Windows)
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install Qt 6.10
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.10.*'
        host: ${{ matrix.host }}
        target: 'desktop'
        arch: ${{ matrix.arch }}
        cache: true

    - name: Prepare the build files
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build the application
      run: cmake --build build --config Release

    - name: Compile Inno Setup (Windows)
      if: matrix.os == 'windows-latest'
      run: iscc installer.iss

    - name: Package App Bundle (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        macdeployqt build/MissionsLog.app -dmg

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "Missions Log ${{ github.ref_name }}"
        files: ${{ matrix.artifact }}
